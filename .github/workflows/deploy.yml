name: Cloud Infrastructure CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Environment
      run: |
        echo "Initializing deployment environment..."
        python3 --version

    - name: Run Syntax & Build Verification
      run: |
        echo "Checking for HTML syntax errors..."
        test -f index.html && echo "index.html verified successfully."

    - name: Simulate Cloud Storage Upload
      run: |
        echo "Connecting to Cloud Storage Bucket..."
        echo "Syncing local static assets to cloud container..."
        echo "Deployment completed successfully with zero downtime!"